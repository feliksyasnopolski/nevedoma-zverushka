SectionVerb {
    EnableSequence [
    ]
    DisableSequence [
    ]
    Value.TQ "HiFi"
}

SectionDevice."Speaker" {
    Comment "Internal speakers"
    ConflictingDevice [ "Headphones" ]
    EnableSequence [
        cdev "hw:mt6768mt6358"
        cset "name='I2S1_CH1 DL1_CH1' off"
        cset "name='I2S1_CH2 DL1_CH2' off"
        cset "name='ADDA_DL_CH1 DL3_CH1' off"
        cset "name='ADDA_DL_CH2 DL3_CH2' off"
        cset "name='HPL Mux' Open"
        cset "name='HPR Mux' Open"
        cset "name='I2S1_HD_Mux' Low_Jitter"
        cset "name='I2S1_CH1 DL3_CH1' on"
        cset "name='I2S1_CH2 DL3_CH2' on"
    ]
    DisableSequence [
        cdev "hw:mt6768mt6358"
        cset "name='I2S1_CH1 DL3_CH1' off"
        cset "name='I2S1_CH2 DL3_CH2' off"
    ]
    Value {
        PlaybackChannels "2"
        PlaybackPriority "100"
        PlaybackPCM "hw:mt6768mt6358,3"
    }
}

SectionDevice."Headphones" {
    Comment "Analog headphones"
    ConflictingDevice [ "Speaker" ]
    EnableSequence [
        cdev "hw:mt6768mt6358"
        cset "name='I2S1_CH1 DL1_CH1' off"
        cset "name='I2S1_CH2 DL1_CH2' off"
        cset "name='I2S1_CH1 DL3_CH1' off"
        cset "name='I2S1_CH2 DL3_CH2' off"
        cset "name='I2S1_HD_Mux' Normal"
        cset "name='ADDA_DL_CH1 DL3_CH1' on"
        cset "name='ADDA_DL_CH2 DL3_CH2' on"
        cset "name='HPL Mux' Audio Playback"
        cset "name='HPR Mux' Audio Playback"
        cset "name='Headset Volume' 9,9"
    ]
    DisableSequence [
        cdev "hw:mt6768mt6358"
        cset "name='ADDA_DL_CH1 DL3_CH1' off"
        cset "name='ADDA_DL_CH2 DL3_CH2' off"
        cset "name='HPL Mux' Open"
        cset "name='HPR Mux' Open"
    ]
    Value {
        PlaybackChannels "2"
        PlaybackPriority "200"
        PlaybackPCM "hw:mt6768mt6358,3"
        JackControl "Headset Jack"
    }
}

SectionDevice."Mic" {
    Comment "Primary analog microphone"
    EnableSequence [
        cdev "hw:mt6768mt6358"
        cset "name='Mic Type Mux' ACC"
        cset "name='ADC L Mux' 'Left Preamplifier'"
        cset "name='ADC R Mux' 'Right Preamplifier'"
        cset "name='PGA L Mux' AIN0"
        cset "name='PGA R Mux' AIN0"
        cset "name='UL1_CH1 ADDA_UL_CH1' on"
        cset "name='UL1_CH2 ADDA_UL_CH2' on"
    ]
    DisableSequence [
        cdev "hw:mt6768mt6358"
        cset "name='UL1_CH1 ADDA_UL_CH1' off"
        cset "name='UL1_CH2 ADDA_UL_CH2' off"
        cset "name='PGA L Mux' None"
        cset "name='PGA R Mux' None"
        cset "name='ADC L Mux' Idle"
        cset "name='ADC R Mux' Idle"
        cset "name='Mic Type Mux' Idle"
    ]
    Value {
        CaptureChannels "2"
        CapturePriority "100"
        CapturePCM "hw:mt6768mt6358,4"
    }
}
